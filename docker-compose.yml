version: '3.8'

services:

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: always
    ports:
      - "3001:3000"
      - "222:22"
    volumes:
      - gitea-data:/data
    environment:
      - APP_NAME=My Gitea
      - RUN_MODE=prod

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitea-data:
  jenkins-data: